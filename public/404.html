<!DOCTYPE html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <title>NOVA SALUD | Redirigiendo...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = path.split('/')[1];
      // If deployed at /repo-name/ or root, redirect to hash route
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace(
        window.location.origin + '/' + (repo ? repo + '/' : '') + '#' + path.replace('/' + repo, '') + search + hash
      );
    </script>
  </head>
  <body>
    <p>Redirigiendo a NOVA SALUD...</p>
  </body>
</html>
